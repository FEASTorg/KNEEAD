name: Build and Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Pull FEAST styling
        run: |
          # Clone just the _sass directory from FEASTorg.github.io
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FEASTorg/FEASTorg.github.io.git /tmp/feast-hub
          cd /tmp/feast-hub
          git sparse-checkout set _sass
          git checkout
          # Verify _sass was checked out
          if [ ! -d "_sass" ]; then
            echo "Error: _sass directory not found after sparse checkout"
            exit 1
          fi
          # Copy FEAST styles into KNEEAD
          mkdir -p ${{ github.workspace }}/docs/_sass
          cp -r _sass/* ${{ github.workspace }}/docs/_sass/
          echo "FEAST styling copied successfully"

      - name: Install Jekyll
        run: gem install jekyll jekyll-feed jekyll-seo-tag jekyll-relative-links jekyll-titles-from-headings jekyll-include-cache just-the-docs

      - name: Build JupyterLite site
        run: |
          rm -rf _output
          jupyter lite build

      - name: Build Jekyll site
        run: |
          cd docs
          jekyll build --destination ../_site
          cd ..

      - name: Copy JupyterLite into site
        run: |
          mkdir -p _site/lite
          cp -r _output/* _site/lite/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
